<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; width: 100%; }
      body {
        align-items: center;
        background: #1c1b1a;
        color: #fafaf9;
        display: flex;
        font-family: Arial, Helvetica, sans-serif;
        gap: 72px;
        padding: 84px 96px;
      }
      img {
        border: 2px solid #44403c;
        border-radius: 24px;
        height: 310px;
        object-fit: cover;
        width: 310px;
      }
      .copy { flex: 1; }
      h1 {
        font-size: 72px;
        letter-spacing: -.045em;
        line-height: 1;
        margin: 0 0 22px;
      }
      .role { color: #fafaf9; font-size: 30px; font-weight: 700; margin: 0 0 12px; }
      .focus { color: #a8a29e; font-size: 28px; line-height: 1.35; margin: 0; }
      .site { color: #d6d3d1; font-size: 22px; margin-top: 42px; }
    </style>
  </head>
  <body>
    <img src="../public/joey-alvarado-portrait.jpg" alt="" />
    <div class="copy">
      <h1>Joey Alvarado</h1>
      <p class="role">Software Developer</p>
      <p class="focus">Rust, backend systems, and web development.</p>
      <p class="site">joeyalvarado.dev</p>
    </div>
  </body>
</html>
